name: ViaFabricPlus Consumer

on:
  pull_request:
    branches:
      - peaks/1.26.40-fixes
  push:
    branches:
      - peaks/1.26.40-fixes
  workflow_dispatch:

permissions:
  contents: read

env:
  VIAFABRICPLUS_REPOSITORY: Peaks2000/ViaFabricPlusPeaks
  VIAFABRICPLUS_REF: ver/26.2

jobs:
  consumer:
    name: Validate ViaFabricPlus consumer
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout ViaBedrock change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ViaBedrock
          persist-credentials: false

      - name: Checkout ViaFabricPlus fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.VIAFABRICPLUS_REPOSITORY }}
          ref: ${{ env.VIAFABRICPLUS_REF }}
          path: ViaFabricPlus
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25
          check-latest: true

      - name: Compile consuming fork
        working-directory: ViaFabricPlus
        run: ./gradlew --include-build ../ViaBedrock compileJava --stacktrace

      - name: Run consuming fork regression tests
        working-directory: ViaFabricPlus
        run: ./gradlew --include-build ../ViaBedrock test -I .codex/skills/maintain-viafabricplus-bedrock/scripts/enable-vfp-tests.gradle --stacktrace

      - name: Build consuming fork
        working-directory: ViaFabricPlus
        run: ./gradlew --include-build ../ViaBedrock build --stacktrace

